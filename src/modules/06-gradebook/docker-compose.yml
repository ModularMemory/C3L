### YamlMime:ManagedReference

services:
  gradebook-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:30600:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__GradebookDatabase: Data Source=/app/data/gradebook.db
    volumes:
      - gradebook-data:/app/data

volumes:
  gradebook-data:
